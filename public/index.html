<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeneratorNickRoblox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>GeneratorNickRoblox</h1>

    <p>Znajdź swój nowy nick do Roblox</p>

    <div class="settings">

        <div class="setting">
            <label>Styl</label>

            <select id="style">
                <option value="clean">Clean</option>
                <option value="short">Krótki</option>
                <option value="gaming">Gaming</option>
                <option value="vfx">VFX</option>
                <option value="random">Mix</option>
            </select>
        </div>

        <div class="setting">
            <label>Długość</label>

            <select id="length">
                <option value="4">4 znaki</option>
                <option value="5" selected>5 znaków</option>
                <option value="6">6 znaków</option>
                <option value="7">7 znaków</option>
                <option value="8">8 znaków</option>
            </select>
        </div>

        <div class="setting">
            <label>Liczba</label>

            <select id="amount">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
            </select>
        </div>

    </div>

    <button class="generate" onclick="generateNames()">
        GENERUJ NICKI
    </button>

    <div id="results"></div>

</div>

<script src="script.js"></script>

</body>
</html>
